<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
      background: #f0f0f0;
    }
    #result {
      font-size: 24px;
      margin-top: 20px;
      padding: 10px;
      background: #fff;
      border-radius: 8px;
      display: inline-block;
      min-width: 200px;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      margin-top: 20px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background-color: #007bff;
      color: white;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <h1>🎤 Voice Calculator</h1>
  <button onclick="startListening()">Start Listening</button>
  <div id="result">Say: 3 plus 5</div>

  <script>
    const resultDiv = document.getElementById("result");

    function startListening() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-US';
      recognition.start();

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript.toLowerCase();
        resultDiv.textContent = "You said: " + transcript;
        const expression = parseVoiceCommand(transcript);
        if (expression) {
          try {
            const evaluated = eval(expression);
            resultDiv.textContent += " → Result: " + evaluated;
          } catch {
            resultDiv.textContent += " → Error in calculation.";
          }
        } else {
          resultDiv.textContent += " → Could not parse expression.";
        }
      };

      recognition.onerror = function(event) {
        resultDiv.textContent = "Error: " + event.error;
      };
    }

    function parseVoiceCommand(input) {
      return input
        .replace(/plus/gi, '+')
        .replace(/minus/gi, '-')
        .replace(/times|multiply by/gi, '*')
        .replace(/divided by|over/gi, '/')
        .replace(/ /g, '');
    }
  </script>

</body>
</html>
