<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>ماشین حساب صوتی فارسی</title>
</head>
<body>
  <h2>🎤 اعداد گفته‌شده:</h2>
  <ul id="number-list"></ul>
  <h3 id="result">نتیجه: —</h3>
  <button onclick="startListening()">شروع ضبط صدا</button>

  <script>
    const recognition = new webkitSpeechRecognition(); 
    recognition.lang = "fa-IR";  // تغییر به زبان فارسی

    let numbers = [];

    function startListening() {
      recognition.start();
    }

    function calculate(type) {
      let result;
      if (numbers.length === 0) return;

      switch (type) {
        case 'جمع':
          result = numbers.reduce((a, b) => a + b, 0);
          break;
        case 'منها':
          result = numbers.reduce((a, b) => a - b);
          break;
        case 'ضرب':
          result = numbers.reduce((a, b) => a * b, 1);
          break;
      }

      document.getElementById('result').textContent = `نتیجه: ${result}`;
      numbers = [];
      document.getElementById("number-list").innerHTML = '';
    }

    recognition.onresult = function (event) {
      let speech = event.results[0][0].transcript.trim();
      console.log("✅ شنیده شد:", speech);

      // تشخیص عملیات‌هایی مانند جمع، منها یا ضرب
      if (speech === 'جمع' || speech === 'منها' || speech === 'ضرب') {
        calculate(speech);
      } else {
        // تبدیل اعداد فارسی به عدد
        let num = parseInt(convertPersianWordToNumber(speech));
        if (!isNaN(num)) {
          numbers.push(num);
          let li = document.createElement("li");
          li.textContent = num;
          document.getElementById("number-list").appendChild(li);
        }
      }
    };

    function convertPersianWordToNumber(word) {
      const map = {
        "صفر": "0", "یک": "1", "دو": "2", "سه": "3", "چهار": "4",
        "پنج": "5", "شش": "6", "هفت": "7", "هشت": "8", "نه": "9",
        "ده": "10", "یازده": "11", "دوازده": "12", "سیزده": "13",
        "چهارده": "14", "پانزده": "15", "شانزده": "16", "هفده": "17",
        "هجده": "18", "نوزده": "19", "بیست": "20"
      };
      return map[word] || word;
    }
  </script>
</body>
</html>
